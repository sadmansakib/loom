[workspace]
resolver = "3"
members = [
    "crates/loom-kernel",
    "crates/loom-store",
    "crates/loom-providers",
    "crates/loom-tools",
    "crates/loom-engine",
    "crates/loom-core",
    "crates/loom-eval",
    "crates/loom-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
# Raised from 1.85 for the `keyring-core` 1.x stack (1.88 MSRV), the CLI's
# OS-keychain backend (ADR-009). Raised again from 1.88 because `uuid` 1.27
# (v7 ids) declares rust-version 1.89, so the floor was unsatisfiable: a
# 1.88 toolchain failed at dependency resolution, not at compilation.
# Verified by building the workspace on 1.89.
rust-version = "1.89"

[workspace.dependencies]
# syntax guard (roadmap item 5 phase B): parse-before-write refusal for
# edit_file/write_file; grammars are per-language, Rust first.
tree-sitter = "0.25"
tree-sitter-rust = "0.24"
# internal crates
loom-kernel = { path = "crates/loom-kernel" }
loom-store = { path = "crates/loom-store" }
loom-providers = { path = "crates/loom-providers" }
loom-tools = { path = "crates/loom-tools" }
loom-engine = { path = "crates/loom-engine" }
loom-core = { path = "crates/loom-core" }

# async runtime (research.md §2: tokio 1.x + tokio-util CancellationToken).
# Version pinned here only — crates add the features they need, so the
# library crates never inherit unrelated runtime features.
tokio = "1.53.1"
tokio-util = "0.7.19"
bytes = "1.10.1"

# child-process control: run commands as process-group leaders so a
# timeout/drop kills the whole tree, not just the direct child.
# `tracing` default off — loom-tools routes its own.
process-wrap = { version = "10.0.1", default-features = false, features = ["tokio1", "process-group", "kill-on-drop"] }

# tokenizer: o200k BPE ranks for real token estimates (engine-side;
# the kernel only sees the TokenEstimator trait).
tiktoken-rs = "0.12.1"

# error handling (research.md §2: thiserror in libraries, anyhow only in the binary)
thiserror = "2.0.21"
anyhow = "1.0.104"

# HTTP client (research.md §3; rustls avoids a system OpenSSL dependency)
# NOTE: reqwest 0.13 renamed the TLS features — `rustls-tls` is now `rustls`.
reqwest = { version = "0.13.5", default-features = false, features = ["json", "stream", "rustls"] }

# serialization
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
# Tool input schemas are generated from each tool's parser struct so the
# model-facing schema and the parser cannot drift (ADR-005 addendum 1, V19).
schemars = { version = "0.8", features = ["derive"] }

# observability (libraries emit `tracing`; only loom-cli installs a subscriber)
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }

# async combinators (BoxStream / BoxFuture for dyn seams)
futures = "0.3.34"

# identifiers: UUID v7, time-ordered (architecture.md §2 `id` module)
uuid = { version = "1.27.0", features = ["v7", "serde"] }

# content addressing (ADR-012 decision 3): artifact bodies are keyed by the
# SHA-256 of their bytes, so identical bodies dedupe and a ref survives the
# file it was read from changing.
sha2 = "0.10.9"

# filesystem tooling (loom-tools: gitignore-aware walk + line search)
ignore = "0.4.33"
regex = "1.13.1"

# CLI
clap = { version = "4.6.7", features = ["derive"] }

# CLI state + credentials (iteration 1H pulls these forward from iteration 2,
# ADR-008/ADR-009). `bundled` ships SQLite with FTS5/JSON1 so behaviour does
# not depend on the system library. `keyring-core` with explicit stores:
# the macOS Keychain directly, and on Linux the Secret Service with a
# kernel-keyutils fallback for headless hosts (no session D-Bus).
rusqlite = { version = "0.40.2", features = ["bundled"] }
keyring-core = "1"
apple-native-keyring-store = { version = "1", features = ["keychain"] }
zbus-secret-service-keyring-store = { version = "1", features = ["crypto-rust"] }
linux-keyutils-keyring-store = "1"
# Hidden secret prompt for `loom auth login` (no echo in a terminal).
rpassword = "7.5.4"

# dev / test-only
wiremock = "0.6.5"
tempfile = "3.27.0"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"

[profile.release]
lto = "thin"
