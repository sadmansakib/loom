[workspace]
resolver = "3"
members = [
    "crates/loom-kernel",
    "crates/loom-store",
    "crates/loom-providers",
    "crates/loom-tools",
    "crates/loom-engine",
    "crates/loom-core",
    "crates/loom-tui",
    "crates/loom-eval",
    "crates/loom-acp",
    "crates/loom-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
# Rust 1.100 is the current project baseline; keep this aligned with the
# toolchain used to develop and lint the workspace.
rust-version = "1.100"

[workspace.dependencies]
# syntax guard (roadmap item 5 phase B): parse-before-write refusal for
# edit_file/write_file; grammars are per-language, Rust first.
tree-sitter = "0.27.2"
tree-sitter-python = "0.25.0"
tree-sitter-rust = "0.24"
tree-sitter-typescript = "0.23"
# internal crates
loom-kernel = { path = "crates/loom-kernel", version = "0.1.0" }
loom-store = { path = "crates/loom-store", version = "0.1.0" }
loom-providers = { path = "crates/loom-providers", version = "0.1.0" }
loom-tools = { path = "crates/loom-tools", version = "0.1.0" }
loom-engine = { path = "crates/loom-engine", version = "0.1.0" }
loom-core = { path = "crates/loom-core", version = "0.1.0" }

# async runtime (research.md §2: tokio 1.x + tokio-util CancellationToken).
# Version pinned here only — crates add the features they need, so the
# library crates never inherit unrelated runtime features.
tokio = "1.53.1"
tokio-util = "0.7.19"
bytes = "1.10.1"

# child-process control: run commands as process-group leaders so a
# timeout/drop kills the whole tree, not just the direct child.
# `tracing` default off — loom-tools routes its own.
process-wrap = { version = "10.0.1", default-features = false, features = ["tokio1", "process-group", "kill-on-drop"] }

# tokenizer: o200k BPE ranks for real token estimates (engine-side;
# the kernel only sees the TokenEstimator trait).
tiktoken-rs = "0.12.1"

# error handling (research.md §2: thiserror in libraries, anyhow only in the binary)
thiserror = "2.0.21"
anyhow = "1.0.104"

# HTTP client (research.md §3; rustls avoids a system OpenSSL dependency)
# NOTE: reqwest 0.13 renamed the TLS features — `rustls-tls` is now `rustls`.
reqwest = { version = "0.13.5", default-features = false, features = ["json", "stream", "rustls"] }

# serialization
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
# Tool input schemas are generated from each tool's parser struct so the
# model-facing schema and the parser cannot drift (ADR-005 addendum 1, V19).
schemars = { version = "1.2.3", features = ["derive"] }

# observability (libraries emit `tracing`; only loom-cli installs a subscriber)
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }

# async combinators (BoxStream / BoxFuture for dyn seams)
futures = "0.3.34"
# Retry-After HTTP-date parsing (loom-providers): tiny, zero-dep.
httpdate = "1"

# identifiers: UUID v7, time-ordered (architecture.md §2 `id` module)
uuid = { version = "1.27.0", features = ["v7", "serde"] }

# LSP protocol types. `async-lsp` is a direct dependency of `loom-tools`.
lsp-types = "0.95"
# ServiceBuilder + Layer for stacking async-lsp's Concurrency/CatchUnwind layers.
tower = { version = "0.5", default-features = false }

# content addressing (ADR-012 decision 3): artifact bodies are keyed by the
# SHA-256 of their bytes, so identical bodies dedupe and a ref survives the
# file it was read from changing.
sha2 = "0.11.1"

# filesystem tooling (loom-tools: gitignore-aware walk + line search)
ignore = "0.4.33"
regex = "1.13.1"

# ACP server mode (roadmap item 37): typed protocol types + the runtime-
# agnostic connection; `stdio` is the only transport ACP v1 defines, and
# the spec REQUIRES stdout to carry protocol messages only. Stable v1 API;
# v2 stays behind the SDK's unstable feature and is not enabled.
agent-client-protocol = { version = "5.0.0", default-features = false, features = ["stdio"] }

# CLI
clap = { version = "4.6.7", features = ["derive"] }

# CLI state + credentials (iteration 1H pulls these forward from iteration 2,
# ADR-008/ADR-009). `bundled` ships SQLite with FTS5/JSON1 so behaviour does
# not depend on the system library. `keyring-core` with explicit stores:
# the macOS Keychain directly, and on Linux the Secret Service with a
# kernel-keyutils fallback for headless hosts (no session D-Bus).
rusqlite = { version = "0.42.0", features = ["bundled"] }
keyring-core = "1"
apple-native-keyring-store = { version = "1", features = ["keychain"] }
dbus-secret-service-keyring-store = { version = "1", features = ["crypto-rust"] }
linux-keyutils-keyring-store = "1"
# Hidden secret prompt for `loom auth login` (no echo in a terminal).
rpassword = "7.5.4"

# dev / test-only
wiremock = "0.6.5"
tempfile = "3.27.0"

[workspace.lints.rust]
# Safety
unsafe_code = "forbid"
unsafe_op_in_unsafe_fn = "deny"

# Correctness
unused_must_use = "deny"
unused_imports = "deny"
unused_variables = "deny"
unused_mut = "deny"

# API documentation
missing_docs = "warn"

[workspace.lints.clippy]
# Core Clippy lints: correctness, suspicious, style, complexity, performance
all = { level = "deny", priority = -1 }

# Stricter code quality and API design
pedantic = { level = "warn", priority = -1 }

# Prohibit dangerous or unfinished coding practices
unwrap_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"

# Error handling discipline
expect_used = "warn"

# API documentation
missing_errors_doc = "warn"
missing_panics_doc = "warn"

# Avoid accidental console output in production code
print_stdout = "warn"
print_stderr = "warn"

# Additional maintainability
wildcard_enum_match_arm = "warn"
enum_glob_use = "deny"
mem_forget = "deny"
# Covers `.to_string()` on &String etc. (replaces removed `string_to_string`)
implicit_clone = "deny"

# Guardrails: fix code rather than adding allows.
# Zero provably-redundant clones (nursery lint, currently zero findings).
redundant_clone = "warn"

[profile.release]
lto = "thin"
