[package]
name = "loom-tools"
description = "Built-in deterministic tools for Loom: read_file, list_dir, search, write_file, edit_file, run_command."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
loom-kernel = { workspace = true }
futures = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
# generated tool input schemas (ADR-005 addendum 1, V19)
schemars = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
# gitignore-aware directory walk (search) and line matching
ignore = { workspace = true }
# syntax guard (roadmap item 5 phase B): parse edited files before write
tree-sitter = { workspace = true }
tree-sitter-python = { workspace = true }
tree-sitter-rust = { workspace = true }
tree-sitter-typescript = { workspace = true }
regex = { workspace = true }
# process-group control for spawned commands (kill the tree on timeout)
process-wrap = { workspace = true }
# killpg in the drop guard that reaps the whole group on cancellation
nix = { version = "0.29", features = ["signal"] }
# spawn_blocking wraps the blocking std::fs work; `process` backs
# run_command and `io-util` its capped stream reads; `time` enforces
# per-command wall-time caps from the policy manifest (architecture.md §9/§12)
tokio = { workspace = true, features = ["rt", "process", "io-util", "time", "fs"] }
# .loom/commands.toml manifest parsing (command execution policy)
toml = "0.9"
# SHA-256 tool-definition pinning for MCP servers (docs/mcp-design.md §3)
sha2 = { workspace = true }
# LSP slice E: typed protocol + async tower client (docs/lsp-design.md)
lsp-types = { workspace = true }
async-lsp = { version = "0.2.4", default-features = false, features = ["tokio", "omni-trait", "client-monitor"] }
tower = { workspace = true }
# CancellationToken in the search walk (per-file cancellation check);
# `compat` adapts the LSP server child's stdin/stdout to async-lsp's
# futures-io framed transport
tokio-util = { workspace = true, features = ["compat"] }

[dev-dependencies]
tempfile = { workspace = true }
# integration tests drive the Tool trait and ToolContext directly, and
# the MCP stdio tests parse JSON-RPC lines alongside the mock server
loom-kernel = { workspace = true }
serde_json = { workspace = true }
tokio-util = { workspace = true }
# #[tokio::test] runtime for tool tests
tokio = { workspace = true, features = ["rt", "macros"] }

[lints]
workspace = true
