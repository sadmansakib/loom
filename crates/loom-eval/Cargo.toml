[package]
name = "loom-eval"
description = "Loom eval harness: SWE-bench Verified runs in container isolation, scored by the official swebench docker harness"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
# dataset fetch for the SWE-bench Verified sweep (swebench.rs); the
# rustls feature set matches the workspace client.
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
# runtime for the dataset fetch inside the swebench-run binary.
tokio = { workspace = true, features = ["rt", "macros", "time"] }
# provider construction for the self-optimization loop's model
# proposer (selfopt): the same validated adapter path every frontend
# uses, via the facade's rolling `engine` alias (`one_shot_provider`);
# kernel names the request types that call sends, futures drives its
# stream. ADR-021: edge crates re-embed through `loom-core` alone.
loom-core = { workspace = true }
futures = { workspace = true }
# binary-digest provenance for sweep reports (honesty rule: one
# headline, one engine build — the digest is the check).
sha2 = "0.10"

[lints]
workspace = true

[[bin]]
name = "swebench-run"
path = "src/bin/swebench_run.rs"

[[bin]]
name = "swebench-contrast"
path = "src/bin/swebench_contrast.rs"

[[bin]]
name = "selfopt"
path = "src/bin/selfopt.rs"
