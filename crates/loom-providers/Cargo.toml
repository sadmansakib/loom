[package]
name = "loom-providers"
description = "Model provider adapters for Loom (DeepSeek via the OpenAI-compatible wire format)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
loom-core = { workspace = true }
bytes = { workspace = true }
reqwest = { workspace = true }
futures = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
# Library code needs only the timeout combinator; the narrow feature
# set keeps external consumers of this crate from compiling the full
# runtime. The version comes from the workspace entry.
tokio = { workspace = true, features = ["time"] }
thiserror = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
wiremock = { workspace = true }
tempfile = { workspace = true }
# Tests use #[tokio::test] (macros + rt), spawn, oneshot, timers, and
# raw TCP servers — so the full test-time feature set.
tokio = { workspace = true, features = ["macros", "rt", "time", "sync", "net", "io-util"] }

[lints]
workspace = true
