[package]
name = "loom-cli"
description = "`loom` binary: argument parsing, tracing, signal handling, output, and exit codes."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "loom"
path = "src/main.rs"

[dependencies]
loom-core = { workspace = true }
anyhow = { workspace = true }
clap = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
# The binary owns the runtime: multi-thread (the provider's timeouts need the
# time driver), macros (async main / select), signal (Ctrl-C), sync, rt.
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time", "signal", "sync"] }
tokio-util = { workspace = true }
# Hidden secret prompt for `loom auth login` (no echo in a terminal).
rpassword = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

[lints]
workspace = true
