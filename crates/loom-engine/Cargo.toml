[package]
name = "loom-engine"
description = "Loom composition root and control plane: configuration, credential resolution, provider/tool composition, session lifecycle, and the driving API frontends share."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
loom-kernel = { workspace = true }
loom-store = { workspace = true }
loom-providers = { workspace = true }
loom-tools = { workspace = true }
# Gitignore-aware walk for the stage-1 repository scan (2E, ADR-015).
ignore = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
# Account metadata store + OS-keychain secret backend (ADR-009, §18.3).
rusqlite = { workspace = true }
# o200k tokenizer for the engine's token estimates (kernel stays pure)
tiktoken-rs = { workspace = true }
# Credential store: keyring-core with explicit per-platform stores — on
# Linux the Secret Service with a kernel-keyutils fallback for headless
# hosts (no session D-Bus), on macOS the Keychain directly.
keyring-core = { workspace = true }
uuid = { workspace = true }
# CancellationToken crosses the driving API (§6.6).
tokio-util = { workspace = true }
# The scout tool's call is async with a wall-clock deadline and a
# parent-cancellation race (roadmap item 19): `time` for the timeout,
# `macros` for `tokio::select!`, `futures` for the `BoxFuture` the
# tool trait returns.
tokio = { workspace = true, features = ["time", "macros"] }
futures = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
zbus-secret-service-keyring-store = { workspace = true }
linux-keyutils-keyring-store = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
# `Engine::open_async` tests (rt + macros for #[tokio::test]).
tokio = { workspace = true, features = ["macros", "rt"] }
# `continue_session` tests build scripted `ModelStream`s with it.
futures = { workspace = true }

[lints]
workspace = true
