[package]
name = "loom-core"
description = "Loom domain model and orchestration: sessions, transcript, model/tool abstractions, context compiler, agent loop."
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
futures = { workspace = true }
# Event channel (ModelStream); declared here rather than relying on
# tokio-util transitively enabling tokio/sync. The tool engine adds
# `time` for ToolContext::timeout enforcement; the agent loop adds
# `macros` for `tokio::select!` (cancellation races).
tokio = { workspace = true, features = ["sync", "time", "macros"] }
tokio-util = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
# #[tokio::test] for the tool-engine and cancellation-table tests.
tokio = { workspace = true, features = ["rt", "macros"] }

[lints]
workspace = true
