[package]
name = "loom-core"
description = "Umbrella facade: the single crate a frontend imports (kernel, engine, providers, tools)."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
loom-kernel = { workspace = true }
loom-store = { workspace = true }
loom-engine = { workspace = true }
loom-providers = { workspace = true }
loom-tools = { workspace = true }

[lints]
workspace = true

[dev-dependencies]
# Frontend examples exercise the facade without adding UI dependencies to
# loom-core's public/runtime dependency surface.
anyhow = { workspace = true }
crossterm = "0.29"
ratatui = { version = "0.30", default-features = false, features = ["crossterm"] }
tokio = { workspace = true, features = ["rt"] }
